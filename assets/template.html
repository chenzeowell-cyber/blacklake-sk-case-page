<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=910, initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>
    @font-face{font-family:MiSans;src:url('assets/fonts/MiSans-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
    @font-face{font-family:MiSans;src:url('assets/fonts/MiSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:block}
    @font-face{font-family:MiSans;src:url('assets/fonts/MiSans-Semibold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:block}
    @font-face{font-family:MiSans;src:url('assets/fonts/MiSans-Heavy.ttf') format('truetype');font-weight:900;font-style:normal;font-display:block}
    :root{--brand:#08b89c;--value:#00a95b;--ink:#222123;--text:#3f4545;--muted:#68827f}
    *{box-sizing:border-box}
    html,body{margin:0;width:910px;min-width:910px;background:#dfe8e8;font-family:MiSans,"Microsoft YaHei",sans-serif;color:var(--ink)}
    #case-page{position:relative;width:910px;height:1236px;overflow:hidden;background:linear-gradient(180deg,#eef5f5 0%,#e9f1f1 58%,#e6efef 100%);isolation:isolate}
    .hero-bg{position:absolute;inset:0 0 auto 0;height:430px;background-image:linear-gradient(180deg,rgba(239,246,246,.08) 0%,rgba(235,243,243,.18) 64%,#eaf2f2 100%),url('assets/hero-background.png');background-size:auto 430px;background-position:center top;opacity:.86;z-index:-2}
    .hero-wash{position:absolute;inset:0 0 auto 0;height:430px;background:linear-gradient(90deg,rgba(239,246,246,.28) 0%,rgba(239,246,246,.08) 52%,rgba(239,246,246,.04) 100%);z-index:-1}
    .brand-logo{position:absolute;left:64px;top:45px;width:142px;height:auto;display:block;mix-blend-mode:multiply}
    .headline{position:absolute;left:84px;top:132px;width:740px;margin:0;font-size:64px;line-height:.98;font-weight:900;letter-spacing:-2.2px;white-space:nowrap;color:#211f21}
    .subtitle{position:absolute;left:85px;top:234px;width:760px;margin:0;font-size:28px;line-height:1.18;font-weight:400;letter-spacing:-.6px;white-space:nowrap;color:#262426}
    .profile{position:absolute;left:86px;top:286px;width:754px;height:126px;border:1px solid rgba(8,184,156,.52);background:rgba(239,248,247,.50);padding:34px 20px 12px}
    .profile-tag{position:absolute;left:0;top:0;height:27px;padding:2px 22px 0 9px;background:var(--brand);color:#fff;font-size:15px;line-height:25px;font-weight:500;letter-spacing:.2px;clip-path:polygon(0 0,91% 0,100% 50%,91% 100%,0 100%)}
    .profile p{margin:0;font-size:16px;line-height:1.58;font-weight:400;letter-spacing:0;color:#42494a}
    .section-heading{position:absolute;left:86px;width:754px;display:flex;align-items:center;gap:10px;margin:0;font-size:28px;line-height:1.15;font-weight:500;letter-spacing:-.4px;color:#29282a}
    .section-heading.pain{top:434px}.section-heading.value{top:746px}
    .section-icon{width:21px;height:25px;border:2px solid var(--brand);border-radius:1px;display:grid;place-items:center;color:var(--brand);font-size:15px;line-height:1;font-weight:600}
    .pain-grid{position:absolute;left:86px;top:475px;width:754px;height:246px;display:grid;grid-template-columns:358px 358px;grid-template-rows:114px 114px;column-gap:38px;row-gap:16px}
    .pain-card{overflow:hidden;border-radius:9px;background:rgba(238,246,245,.66)}
    .pain-card h3{height:30px;margin:0;display:flex;align-items:center;justify-content:center;background:rgba(111,158,155,.24);color:#68827f;font-size:17px;line-height:1.2;font-weight:600;letter-spacing:.2px}
    .pain-card p{margin:0;padding:8px 17px 7px;font-size:14.5px;line-height:1.48;font-weight:400;letter-spacing:0;color:#3f4545}
    .scene-card,.result-card{position:relative;overflow:hidden;border-radius:9px;background:#d9e4e3}
    .scene-card img,.result-card img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
    .media-badge{position:absolute;right:8px;bottom:7px;padding:3px 6px;border-radius:4px;background:rgba(21,45,42,.66);color:#fff;font-size:10px;line-height:1;font-weight:500;letter-spacing:.4px}
    .value-grid{position:absolute;left:86px;top:793px;width:754px;height:357px;display:grid;grid-template-columns:358px 358px;grid-template-rows:170px 170px;column-gap:38px;row-gap:17px}
    .value-card{display:grid;grid-template-columns:145px 1fr;gap:13px;overflow:hidden;border-radius:9px;background:rgba(245,251,250,.78);padding:11px 12px 10px}
    .value-media{position:relative;overflow:hidden;border:1px solid rgba(8,184,156,.52);border-radius:8px;background:#f6fbfb}
    .value-media img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
    .value-copy{padding-top:1px}
    .value-copy h3{position:relative;margin:0 0 8px;padding-left:22px;color:var(--value);font-size:17px;line-height:1.24;font-weight:600;letter-spacing:0}
    .value-copy h3::before{content:'✓';position:absolute;left:0;top:-1px;font-size:22px;line-height:1;color:var(--value);font-weight:600}
    .value-copy p{margin:0;font-size:14.5px;line-height:1.48;font-weight:400;letter-spacing:0;color:#3f4545}
    .footer-wave{position:absolute;left:-80px;top:1152px;width:1070px;height:170px;z-index:-1;overflow:hidden}
    .footer-wave::before,.footer-wave::after{content:'';position:absolute;border-radius:50%;transform:rotate(-7deg)}
    .footer-wave::before{left:0;top:42px;width:980px;height:115px;border-top:16px solid rgba(41,174,228,.52);box-shadow:0 -13px 0 rgba(83,204,234,.22),0 -29px 0 rgba(139,230,237,.18)}
    .footer-wave::after{left:360px;top:25px;width:760px;height:135px;border-top:18px solid rgba(21,191,151,.48);box-shadow:0 -14px 0 rgba(82,218,180,.22),0 -30px 0 rgba(145,236,211,.18)}
    .placeholder{display:grid!important;place-items:center!important;background:linear-gradient(135deg,#edf5f4,#dce8e7)!important;color:#78918e!important;font-size:13px!important;line-height:1.3!important;text-align:center!important;padding:12px!important}
  </style>
</head>
<body>
  <main id="case-page">
    <div class="hero-bg"></div><div class="hero-wash"></div>
    <img class="brand-logo" src="assets/blacklake-xiaogongdan-logo.png" alt="黑湖小工单">
    <h1 class="headline">{{HEADLINE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <section class="profile"><div class="profile-tag">客户简介</div><p>{{PROFILE}}</p></section>
    <h2 class="section-heading pain"><span class="section-icon">?</span><span>需求痛点</span></h2>
    <section class="pain-grid">{{PAIN_CARDS}}{{SCENE_MEDIA}}</section>
    <h2 class="section-heading value"><span class="section-icon">≡</span><span>方案及价值</span></h2>
    <section class="value-grid">{{VALUE_CARDS}}{{RESULT_MEDIA}}</section>
    <div class="footer-wave"></div>
  </main>
</body>
</html>
